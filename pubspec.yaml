  fonts:
    # -- 1) Police Quicksand (versions fixes) --
    - family: Quicksand
      fonts:
        - asset: res/font_family/quicksand/Quicksand-Light.ttf
          weight: 300
        - asset: res/font_family/quicksand/Quicksand-Regular.ttf
          weight: 400
        - asset: res/font_family/quicksand/Quicksand-Medium.ttf
          weight: 500
        - asset: res/font_family/quicksand/Quicksand-SemiBold.ttf
          weight: 600
        - asset: res/font_family/quicksand/Quicksand-Bold.ttf
          weight: 700

    # -- 2) Police Quicksand (version variable) --
    - family: QuicksandVariable
      fonts:
